name: Reference CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: reference-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Jsonnet
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jsonnet
          jsonnet --version
      - name: Run projection and failure-path tests
        run: python3 -m unittest discover -s tests -v
      - name: Generate and validate the complete reference
        run: |
          python3 scripts/reference.py generate --output generated
          python3 scripts/reference.py validate --generated generated
          python3 scripts/check_contract.py --generated generated
          python3 scripts/reference.py import-studio --source tests/fixtures/studio-hub-b.jsonnet --home-region eu-frankfurt-1 --landing-zone-environment shared --notification-email operations@example.com --output generated/studio-example
          python3 scripts/reference.py validate --generated generated/studio-example
          python3 scripts/check_contract.py --generated generated/studio-example
          python3 scripts/check_docs.py
